<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;background:#050507;overflow:hidden}
/* App theme: near-black with the gold glow used behind TheatreSync's cards */
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 55% 45% at 50% 50%,rgba(232,184,74,.14),transparent 70%);opacity:0;animation:fade 1.2s .1s forwards, out .7s 3.5s forwards}
.mark{position:absolute;left:50%;top:50%;width:900px;height:440px;margin:-220px 0 0 -450px;opacity:0;transform:scale(.97);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent),linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);-webkit-mask-composite:source-in;
  animation:in 1s .15s cubic-bezier(.2,.7,.2,1) forwards, out .7s 3.5s forwards}
.mark img{position:absolute;inset:0;width:100%;height:100%}
/* The website's sheen (qwShine): a soft light sweeping across the letters */
.sheen{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:url(card_wordmark.png);-webkit-mask-size:100% 100%}
.sheen span{position:absolute;top:-50%;left:0;width:55%;height:200%;background:linear-gradient(100deg,transparent 30%,rgba(255,248,214,.9) 50%,transparent 70%);filter:blur(3px);transform:skewX(-14deg) translateX(-220%);animation:shine 1.6s 1s ease-in-out forwards}
@keyframes in{to{opacity:1;transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes shine{to{transform:skewX(-14deg) translateX(320%)}}
@keyframes out{to{opacity:0}}
</style></head><body>
<div class="glow"></div>
<div class="mark"><img src="card_wordmark.png"><div class="sheen"><span></span></div></div>
</body></html>
