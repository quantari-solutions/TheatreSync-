<!doctype html><html><head><meta charset="utf-8"><style>
/* TV screensaver scene, 1920×1080, 15 s: the Signature Intro, each time with its own random timing, glow
   swells, light sweeps and sparks. Every scene rises out of pure black and dissolves back into pure black,
   so the phone can play them in any order, endlessly, with nothing to see at the joins. ?seed=N picks one. */
html,body{margin:0;width:1920px;height:1080px;background:#000;overflow:hidden;font-family:"Inter","Helvetica Neue",Arial,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 46%,rgba(232,184,74,.26),rgba(232,184,74,.11) 45%,transparent 75%);opacity:0}
.halo{position:absolute;left:50%;top:672px;width:1500px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(ellipse closest-side,rgba(232,184,74,.16),rgba(232,184,74,.09) 35%,rgba(232,184,74,.025) 70%,transparent);opacity:0}
.stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.mark{position:relative;width:600px;height:254px;opacity:0}
.inner{position:absolute;left:40px;top:0;width:520px;height:254px}
.inner img{position:absolute;inset:0;width:100%;height:100%}
.sheen{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:url(card_wordmark_soft.png);-webkit-mask-size:100% 100%}
.sheen span{position:absolute;top:-50%;left:0;width:55%;height:200%;background:linear-gradient(100deg,transparent 30%,rgba(255,248,214,.9) 50%,transparent 70%);filter:blur(2px);transform:skewX(-14deg) translateX(-220%)}
.eyebrow{margin-top:26px;color:#E8B84A;letter-spacing:.42em;font-size:26px;font-weight:700;opacity:0}
.title{position:relative;font-size:132px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#E8B84A,#FFE7A3 55%,#E8B84A);-webkit-background-clip:text;color:transparent;opacity:0}
.line{width:0;height:2px;background:linear-gradient(90deg,transparent,#E8B84A,transparent)}
.tag{margin-top:8px;color:#A9A39A;font-size:34px;letter-spacing:.06em;opacity:0}
.spark{position:absolute;border-radius:50%;background:#FFE7A3;box-shadow:0 0 10px 2px rgba(232,184,74,.7);opacity:0}
</style></head><body>
<div class="glow" id="glow"></div><div class="halo" id="halo"></div>
<div class="stack" id="stack">
  <div class="mark" id="mark"><div class="inner"><img src="card_wordmark_soft.png"><div class="sheen"><span id="sheen"></span></div></div></div>
  <div class="eyebrow" id="eyebrow">PRESENTED WITH</div>
  <div class="title" id="title">TheatreSync</div>
  <div class="line" id="line"></div>
  <div class="tag" id="tag">a Quantari Solutions module</div>
</div>
<script>
const seed = +(new URLSearchParams(location.search).get('seed') || 1);
let st = (seed * 2654435761) % 4294967296;
const rnd = () => { st = (st * 1664525 + 1013904223) % 4294967296; return st / 4294967296; };
const D = 15;
const clamp = x => Math.min(1, Math.max(0, x));
const gentle = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));                 // sine ease in-out
const soft = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };              // ease out
const seg = (t, a, d, e = gentle) => e((t - a) / d);
const bump = (t, c, w) => { const x = (t - c) / w; return Math.abs(x) >= 1 ? 0 : (0.5 + 0.5 * Math.cos(Math.PI * x)) ** 2; };
// This scene's own timing and moments.
const j = () => (rnd() - 0.5);
const T = { mark: 0.5 + j() * 0.6, eyebrow: 2.6 + j() * 0.5, title: 3.0 + j() * 0.5, line: 3.8 + j() * 0.4, tag: 4.3 + j() * 0.4, out: 12.3 + j() * 0.6 };
const sheens = [{ start: 1.5 + rnd() * 0.8, len: 1.7 + rnd() * 0.6 }];
if (rnd() < 0.6) sheens.push({ start: 7 + rnd() * 3, len: 1.6 + rnd() * 0.8 });
const swells = Array.from({ length: 1 + Math.floor(rnd() * 2) }, () => ({ c: 6.5 + rnd() * 4.5, w: 1.4 + rnd() * 1.6, a: 0.3 + rnd() * 0.5 }));
const drift = { x: (rnd() - 0.5) * 12, y: (rnd() - 0.5) * 14 };
const sparks = Array.from({ length: 8 + Math.floor(rnd() * 10) }, () => {
  const life = 2.5 + rnd() * 4, t0 = 1.5 + rnd() * (T.out - life - 1.5);
  const e = document.createElement('div'); e.className = 'spark'; const size = 2 + rnd() * 4; e.style.width = e.style.height = size + 'px'; document.body.appendChild(e);
  return { e, t0, life, x: 120 + rnd() * 1680, y: 160 + rnd() * 860, dx: (rnd() - 0.5) * 140, dy: -(60 + rnd() * 220), peak: 0.4 + rnd() * 0.6 };
});
const $ = id => document.getElementById(id);
const rise = (el, p) => { el.style.opacity = p.toFixed(4); el.style.transform = `translateY(${((1 - p) * 24).toFixed(2)}px)`; };
window.renderAt = function (t) {
  const out = 1 - seg(t, T.out, D - T.out);                  // everything back to pure black by the end
  const sw = swells.reduce((s, b) => s + b.a * bump(t, b.c, b.w), 0);
  const bloom = seg(t, T.title + 0.2, 1.7);
  $('glow').style.opacity = (seg(t, 0, 2.2) * (0.62 + 0.38 * sw) * out).toFixed(4);
  $('halo').style.opacity = (bloom * (0.6 + 0.4 * sw) * out).toFixed(4);
  $('stack').style.opacity = out.toFixed(4);
  $('stack').style.transform = `translate(${(drift.x * gentle(t / D * 2)).toFixed(2)}px, ${(drift.y * gentle(t / D * 2)).toFixed(2)}px)`;
  const m = seg(t, T.mark, 1.6, soft); $('mark').style.opacity = m.toFixed(4); $('mark').style.transform = `scale(${(0.96 + 0.04 * m).toFixed(4)})`;
  const sh = sheens.find(s => t >= s.start && t <= s.start + s.len);
  $('sheen').style.transform = `skewX(-14deg) translateX(${sh ? (-220 + 540 * gentle((t - sh.start) / sh.len)).toFixed(1) : -220}%)`;
  rise($('eyebrow'), seg(t, T.eyebrow, 0.9, soft));
  rise($('title'), seg(t, T.title, 1.2, soft));
  $('title').style.filter = `drop-shadow(0 0 ${(6 + 30 * bloom + 22 * sw).toFixed(1)}px rgba(232,184,74,${(0.25 + 0.45 * bloom + 0.25 * sw).toFixed(3)}))`;
  $('line').style.width = (640 * seg(t, T.line, 1.4)).toFixed(1) + 'px';
  rise($('tag'), seg(t, T.tag, 0.9, soft));
  for (const s of sparks) {
    const p = (t - s.t0) / s.life;
    if (p <= 0 || p >= 1) { s.e.style.opacity = 0; continue; }
    s.e.style.opacity = (s.peak * Math.sin(Math.PI * p) * out).toFixed(3);
    s.e.style.transform = `translate(${s.x + s.dx * p}px, ${s.y + s.dy * p}px)`;
  }
};
renderAt(0);
</script>
</body></html>
