<!doctype html><html><head><meta charset="utf-8"><style>
/* TV screensaver scene, 1920×1080, 10 s. The phone strings many of these together in random order
   (an endless live stream), so the screen never repeats in a noticeable way. ?seed=N picks the scene.
   Every scene starts and ends in the same calm state, so any scene can follow any other seamlessly. */
html,body{margin:0;width:1920px;height:1080px;background:#050507;overflow:hidden;font-family:"Inter","Helvetica Neue",Arial,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 58% 48% at 50% 47%,rgba(232,184,74,.26),rgba(232,184,74,.11) 45%,transparent 75%);opacity:.62}
.halo{position:absolute;left:50%;top:640px;width:1400px;height:500px;transform:translate(-50%,-50%);background:radial-gradient(ellipse closest-side,rgba(232,184,74,.14),rgba(232,184,74,.07) 40%,transparent);opacity:.6}
.stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.mark{position:relative;width:600px;height:254px;-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);-webkit-mask-composite:source-in;opacity:.92}
.inner{position:absolute;left:40px;top:0;width:520px;height:254px}
.inner img{position:absolute;inset:0;width:100%;height:100%}
.sheen{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:url(card_wordmark.png);-webkit-mask-size:100% 100%}
.sheen span{position:absolute;top:-50%;left:0;width:55%;height:200%;background:linear-gradient(100deg,transparent 30%,rgba(255,248,214,.85) 50%,transparent 70%);filter:blur(2px);transform:skewX(-14deg) translateX(-220%)}
.title{margin-top:30px;font-size:96px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#E8B84A,#FFE7A3 55%,#E8B84A);-webkit-background-clip:text;color:transparent}
.tag{color:#8F897F;font-size:28px;letter-spacing:.08em}
.spark{position:absolute;border-radius:50%;background:#FFE7A3;box-shadow:0 0 10px 2px rgba(232,184,74,.7);opacity:0}
.ray{position:absolute;top:-20%;height:140%;width:180px;background:linear-gradient(90deg,transparent,rgba(232,184,74,.05),transparent);transform:rotate(18deg);opacity:0}
</style></head><body>
<div class="glow" id="glow"></div><div class="halo" id="halo"></div><div class="ray" id="ray"></div>
<div class="stack" id="stack">
  <div class="mark"><div class="inner"><img src="card_wordmark.png"><div class="sheen"><span id="sheen"></span></div></div></div>
  <div class="title" id="title">TheatreSync</div>
  <div class="tag">Ready when you are</div>
</div>
<script>
// Deterministic random per scene (same seed → same frames, so rendering is repeatable).
const seed = +(new URLSearchParams(location.search).get('seed') || 1);
let st = seed * 2654435761 % 4294967296;
const rnd = () => { st = (st * 1664525 + 1013904223) % 4294967296; return st / 4294967296; };
const D = 10; // seconds
// Smooth bumps that are exactly zero (and flat) at the start and end of the scene.
const bump = (t, c, w) => { const x = (t - c) / w; return Math.abs(x) >= 1 ? 0 : (0.5 + 0.5 * Math.cos(Math.PI * x)) ** 2; };
const edge = t => Math.sin(Math.PI * t / D) ** 2; // 0 at both ends
const glowBumps = Array.from({ length: 1 + Math.floor(rnd() * 3) }, () => ({ c: 1.5 + rnd() * 7, w: 1.2 + rnd() * 2.2, a: 0.15 + rnd() * 0.3 }));
const bloomBumps = Array.from({ length: 1 + Math.floor(rnd() * 2) }, () => ({ c: 2 + rnd() * 6, w: 1.5 + rnd() * 2, a: 0.4 + rnd() * 0.6 }));
const sheen = rnd() < 0.55 ? { start: 0.8 + rnd() * 5, len: 1.6 + rnd() * 1.4 } : null;
const ray = rnd() < 0.5 ? { x0: -400 + rnd() * 600, dir: rnd() < 0.5 ? 1 : -1, a: 0.6 + rnd() * 0.4 } : null;
const driftY = (rnd() - 0.5) * 16, driftX = (rnd() - 0.5) * 10;
const sparks = Array.from({ length: 8 + Math.floor(rnd() * 10) }, () => {
  const life = 2.5 + rnd() * 4; const t0 = rnd() * (D - life);
  const e = document.createElement('div'); e.className = 'spark'; const size = 2 + rnd() * 4;
  e.style.width = e.style.height = size + 'px'; document.body.appendChild(e);
  return { e, t0, life, x: 120 + rnd() * 1680, y: 200 + rnd() * 820, dx: (rnd() - 0.5) * 140, dy: -(60 + rnd() * 220), peak: 0.5 + rnd() * 0.5 };
});
const $ = id => document.getElementById(id);
window.renderAt = function (t) {
  const g = glowBumps.reduce((s, b) => s + b.a * bump(t, b.c, b.w), 0);
  $('glow').style.opacity = (0.62 + g).toFixed(4);
  const bl = bloomBumps.reduce((s, b) => s + b.a * bump(t, b.c, b.w), 0);
  $('halo').style.opacity = (0.6 + 0.4 * bl).toFixed(4);
  $('title').style.filter = `drop-shadow(0 0 ${(14 + 30 * bl).toFixed(1)}px rgba(232,184,74,${(0.35 + 0.5 * bl).toFixed(3)}))`;
  $('stack').style.transform = `translate(${(driftX * edge(t)).toFixed(2)}px, ${(driftY * edge(t)).toFixed(2)}px)`;
  if (sheen) { const p = Math.min(1, Math.max(0, (t - sheen.start) / sheen.len)); const e = p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2; $('sheen').style.transform = `skewX(-14deg) translateX(${-220 + 540 * e}%)`; }
  if (ray) { $('ray').style.left = (960 + ray.x0 + ray.dir * 900 * (t / D - 0.5)) + 'px'; $('ray').style.opacity = (ray.a * edge(t)).toFixed(3); }
  for (const s of sparks) {
    const p = (t - s.t0) / s.life;
    if (p <= 0 || p >= 1) { s.e.style.opacity = 0; continue; }
    s.e.style.opacity = (s.peak * Math.sin(Math.PI * p)).toFixed(3);
    s.e.style.transform = `translate(${s.x + s.dx * p}px, ${s.y + s.dy * p}px)`;
  }
};
renderAt(0);
</script>
</body></html>
