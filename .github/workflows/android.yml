name: Android

on:
  pull_request:
    paths: ["android/**", "contracts/**", "scripts/*android*", "scripts/_android-env.sh", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "contracts/**", "scripts/*android*", "scripts/_android-env.sh", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      # ubuntu-latest ships an Android SDK; the script only adds missing packages.
      - name: Android SDK
        run: ./scripts/setup-android.sh

      - name: Unit tests + lint
        run: ./scripts/test-android.sh

      - name: Build debug APK
        run: ./scripts/build-android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheatreSync-apk
          path: |
            dist/TheatreSync.apk
            dist/TheatreSync-debug.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/*/build/reports/
            android/*/build/test-results/
          retention-days: 7

  # Runs the real app and real audio playback on an Android emulator.
  # Proves the UI, the built-in server and the sync loop work on Android.
  # It does NOT prove Chromecast or Bluetooth behaviour — those need the real devices.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The emulator needs ~7.4 GB free for its data partition; hosted runners sometimes
      # have less (run on PR #22 failed with 7.28 GB). Remove large tools this job never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android SDK
        run: ./scripts/setup-android.sh

      - name: Instrumented tests on emulator (API 34, Google APIs)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          working-directory: ./android
          # 1) instrumented tests on the debug build, 2) smoke test of the optimised (R8) build:
          #    install, launch, and fail if it crashes within 8 seconds.
          script: |
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            ./gradlew --no-daemon :app:connectedDebugAndroidTest :app:assembleRelease
            adb install -r app/build/outputs/apk/release/app-x86_64-release.apk
            adb logcat -c
            adb shell am start -W -n com.theatresync.app/.MainActivity
            sleep 8
            adb shell pidof com.theatresync.app || (adb logcat -d -s AndroidRuntime:E; exit 1)
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then adb logcat -d -s AndroidRuntime:E; exit 1; fi
            echo "Release build launched without crashing"
            # The owner's way of opening the app, simulated: is the Quantari opening shown, and for its full length?
            ../scripts/opening-sim.sh
            # Monkey: thousands of random taps, swipes and rotations on the optimised app.
            # Stays inside TheatreSync (-p), no system keys. Fails on any TheatreSync crash or ANR, or if it
            # stops early. A freeze of another app (e.g. the keyboard on the slow emulator) is logged, not fatal.
            adb logcat -c
            adb shell monkey -p com.theatresync.app --pct-syskeys 0 --pct-appswitch 0 --ignore-timeouts --throttle 60 -s 4242 -v 3000 > monkey.txt 2>&1 || true
            tail -5 monkey.txt
            if grep -qE "// (CRASH|NOT RESPONDING): com\.theatresync|Monkey aborted" monkey.txt; then grep -A30 -E "// (CRASH|NOT RESPONDING): com\.theatresync|Monkey aborted" monkey.txt; exit 1; fi
            if grep -E "// NOT RESPONDING" monkey.txt; then echo "Another app (not TheatreSync) froze on the slow emulator; ignored"; fi
            grep -q "Events injected: 3000" monkey.txt || (echo "Monkey stopped early"; tail -40 monkey.txt; exit 1)
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then adb logcat -d -s AndroidRuntime:E; exit 1; fi
            echo "Monkey stress test passed (3000 random events, no crash)"

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: android/app/build/reports/androidTests/
          retention-days: 7
