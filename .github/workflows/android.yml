name: Android

on:
  pull_request:
    paths: ["android/**", "contracts/**", "scripts/*android*", "scripts/_android-env.sh", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "contracts/**", "scripts/*android*", "scripts/_android-env.sh", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships an Android SDK; the script only adds missing packages.
      - name: Android SDK
        run: ./scripts/setup-android.sh

      - name: Unit tests + lint
        run: ./scripts/test-android.sh

      - name: Build debug APK
        run: ./scripts/build-android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheatreSync-debug-apk
          path: dist/TheatreSync-debug.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/*/build/reports/
            android/*/build/test-results/
          retention-days: 7
